[server]
# 브라우저 자동 실행 비활성화 (서버 환경용)
headless = true

# 파일 감시 폴링 (네트워크 드라이브 / WSL 환경 안정성)
fileWatcherType = "poll"

# ⚠ address / port 는 여기에 두지 않습니다.
#   - Streamlit Cloud: 기본 포트(8501)로 떠야 health check 통과
#   - 로컬 외부접속(0.0.0.0:8502): run.bat 에서 CLI 옵션으로 지정

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#00FF88"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2E"
textColor = "#FAFAFA"
